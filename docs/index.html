<!doctype html>
<html lang="sv">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080e19"><meta name="description" content="Iron Signal – ett retroactionspel med fem banor, teleporter och pixelgrafik. Spela direkt i webbläsaren."><title>Iron Signal · Web Arcade</title><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="stylesheet" href="./style.css"></head>
<body>
<main>
  <header><div><p class="eyebrow">SECTOR COMMAND // WEB ARCADE</p><h1>IRON <span>SIGNAL</span></h1></div><span class="edition">05 SECTORS<br>ONE MISSION</span></header>
  <div class="cabinet" id="cabinet">
    <canvas id="game" width="960" height="540" tabindex="0" aria-label="Iron Signal. A och D flyttar, mellanslag hoppar, J skjuter, Esc pausar."></canvas>
    <section id="menu" class="menu" aria-label="Spelmeny"><p id="mission-number" class="eyebrow"></p><h2 id="menu-title">LADDAR SPELET…</h2><p id="menu-copy"></p><div id="mission-list" class="missions"></div><div id="menu-actions" class="actions"></div><p id="menu-help" class="menu-help"></p></section>
  </div>
  <nav class="toolbar" aria-label="Spelkontroller"><button id="pause">Pausa · Esc</button><button id="map">Karta · Tab</button><button id="music">Välj musik · M</button><button id="mute" aria-pressed="false">Ljud på · X</button><button id="fullscreen">Helskärm</button><input id="audio-file" type="file" accept="audio/*" hidden></nav>
  <p id="audio-status" class="audio-status" role="status">Ljudeffekter är redo. Välj en egen musikfil om du vill.</p>
  <div class="touch" aria-label="Pekkontroller"><div><button data-key="left" aria-label="Vänster">◀</button><button data-key="right" aria-label="Höger">▶</button><button data-key="up" aria-label="Sikta upp">↑</button></div><div><button data-action="warp">E ↯</button><button data-key="jump">HOPPA</button><button data-key="fire">SKJUT</button></div></div>
  <footer><p><kbd>A</kbd><kbd>D</kbd> Flytta <kbd>Space</kbd> Hoppa <kbd>J</kbd> Skjut <kbd>W</kbd> Sikta upp <kbd>E</kbd> Teleport</p><p>Samla sex kapslar, besegra säkerhetskärnan och nå utgången. <span class="muted">Bäst med tangentbord.</span></p></footer>
  <p id="announcement" class="sr-only" aria-live="polite"></p>
  <noscript>Spelet behöver JavaScript för att starta.</noscript>
</main><script type="module" src="./app.mjs"></script></body></html>
